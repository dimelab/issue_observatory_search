# Issue Observatory — deployment stack.
#
# Service/container/port layout matches docs/DEPLOYMENT.md. All services share one
# image (Dockerfile, target: development) so the worker has the same spaCy models
# and Playwright browser as the API.
#
# Volume names are explicit and project-independent: Docker reuses a volume that
# already exists under that name and only creates it when missing. To attach to an
# existing production volume, set POSTGRES_VOLUME_NAME in .env.

x-app-build: &app_build
  context: .
  dockerfile: Dockerfile
  target: development

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: issue_observatory_db
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-issue_observatory}
    ports:
      # Bound to loopback: the database must not be reachable from outside the host.
      - "127.0.0.1:${DB_PORT_HOST:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-issue_observatory}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: issue_observatory_redis
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:${REDIS_PORT_HOST:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build: *app_build
    image: issue_observatory:latest
    container_name: issue_observatory_backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment: &app_env
      # Derived here rather than taken from .env: inside the compose network the
      # host is always "postgres", whatever .env says for host-side tooling.
      DATABASE_URL: postgresql+psycopg://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-issue_observatory}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      NETWORK_EXPORT_DIR: /app/data/networks
      PYTHONPATH: /app
    ports:
      - "127.0.0.1:${BACKEND_PORT_HOST:-8080}:8000"
    volumes:
      - .:/app
      - app_data:/app/data
    command: >
      sh -c "
        mkdir -p /app/data/networks /app/data/exports &&
        alembic upgrade head &&
        uvicorn backend.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips='*'
      "
    restart: unless-stopped

  celery_worker:
    build: *app_build
    image: issue_observatory:latest
    container_name: issue_observatory_celery_worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment: *app_env
    volumes:
      # The whole tree, not just backend/: the worker imports scripts and needs
      # PYTHONPATH=/app to resolve the backend package.
      - .:/app
      - app_data:/app/data
    # One worker across every routed queue. Tasks whose queue has no consumer sit
    # in Redis forever, so this list must cover celery_app.conf.task_routes.
    command: >
      celery -A backend.celery_app:celery_app worker
      --loglevel=info
      -Q celery,scraping,analysis,networks,search
    restart: unless-stopped

  celery_beat:
    build: *app_build
    image: issue_observatory:latest
    container_name: issue_observatory_celery_beat
    depends_on:
      - backend
      - redis
    env_file:
      - .env
    environment: *app_env
    volumes:
      - .:/app
      - app_data:/app/data
    command: >
      celery -A backend.celery_app:celery_app beat
      --loglevel=info
      -s /tmp/celerybeat-schedule
    restart: unless-stopped

  flower:
    build: *app_build
    image: issue_observatory:latest
    container_name: issue_observatory_flower
    depends_on:
      - redis
      - celery_worker
    env_file:
      - .env
    environment: *app_env
    ports:
      - "127.0.0.1:${FLOWER_PORT_HOST:-5555}:5555"
    volumes:
      - .:/app
    command: celery -A backend.celery_app:celery_app flower --port=5555
    restart: unless-stopped

  # Reverse proxy. Opt in with:  docker compose --profile proxy up -d
  # nginx/nginx.conf still carries Let's Encrypt paths for "your-domain" and will
  # not start until real certificates exist, so it stays out of the default set.
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: issue_observatory_nginx
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./frontend/static:/var/www/static:ro
    profiles:
      - proxy
    restart: unless-stopped

  # Database UI. Opt in with:  docker compose --profile tools up -d
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: issue_observatory_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "127.0.0.1:5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    profiles:
      - tools

volumes:
  postgres_data:
    name: ${POSTGRES_VOLUME_NAME:-issue_observatory_postgres_data}
  redis_data:
    name: ${REDIS_VOLUME_NAME:-issue_observatory_redis_data}
  app_data:
    name: ${APP_VOLUME_NAME:-issue_observatory_app_data}
  pgadmin_data:
    name: issue_observatory_pgadmin_data

networks:
  default:
    name: issue_observatory_network
